{% extends "base.html" %}

{% block title %}تسجيل الدخول | منصة التفتيش{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-lock text-primary display-4"></i>
                <h3 class="card-title my-3">تسجيل الدخول</h3>
                <p class="text-muted">منصة مفتش التكوين والتعليم المهنيين</p>
                <form method="post" class="text-start mt-4">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3"><i class="bi bi-box-arrow-in-right"></i> دخول</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
